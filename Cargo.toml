[package]
name = "kozmos"
version = "0.2.0"
edition = "2024"
description = "Yerel agent çalışma alanı ve yapılandırma yönetim merkezi"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.0", features = ["rt", "time", "process", "io-util", "macros"] }
toml = { version = "1.1.8", features = ["parse"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 2
strip = true
